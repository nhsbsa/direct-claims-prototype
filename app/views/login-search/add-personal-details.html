<!-- Use this page as the index for your project -->

<!-- ADDING CUSTOM CSS - Add your custom CSS or Sass in /app/assets/sass/main.scss -->

<!-- Extends the layout from /app/views/layout.html -->
{% extends 'layout.html' %}
<!--
  In /app/views/layout.html you can:
    - change the header and footer
    - add custom CSS and JavaScript
-->

<!--
  Use this to set the page name which will appear at the
  start of the <title> tag, followed by the service name.
  This is often not needed on the homepage, where only the
  service name is needed. You can also reuse this variable
  within the <h1>, where they are the same.
-->
{% set pageName = "" %}

<!-- For adding a breadcrumb or back link -->
<!-- Code examples can be found at https://service-manual.nhs.uk/design-system/components/breadcrumbs and https://service-manual.nhs.uk/design-system/components/back-link -->
{% block beforeContent %}
{% endblock %}

<!-- For adding page content -->
<!-- Page layout code can be found at https://service-manual.nhs.uk/design-system/styles/layout -->
{% block content %}
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NHS Design System Layout</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nhsuk-frontend@latest/dist/nhsuk.min.css">
  
   <div class="nhsuk-phase-banner">
  <p class="nhsuk-phase-banner__content">
    <strong class="nhsuk-tag nhsuk-phase-banner__content__tag">
     Beta
    </strong>
    <span class="nhsuk-phase-banner__text">
      This is a new service undergoing testing
    </span>
  </p>
</div>

<a href="search-results2.html" class="govuk-back-link">Back</a>

  <main class="nhsuk-main-wrapper" id="maincontent">

    <h1 class="nhsuk-heading-xl">
            Add personal details
        </h1>

        <form action="add-address.html" method="post" novalidate>


    <div class="nhsuk-form-group">
  <label class="nhsuk-label" for="input-width-20">
    First name
  </label>
  <input class="nhsuk-input nhsuk-input--width-20" id="input-width-20" name="inputWidth20" type="text">
</div>

<div class="nhsuk-form-group">
  <label class="nhsuk-label" for="input-width-20">
    Last name
  </label>
  <input class="nhsuk-input nhsuk-input--width-20" id="input-width-20" name="inputWidth20" type="text">
</div>

<div class="nhsuk-form-group">
  <fieldset class="nhsuk-fieldset" role="group" aria-describedby="date-of-birth-hint">
     <label class="nhsuk-label" for="date-of-birth">
    Date of birth
  </label>
    <div class="nhsuk-hint" id="date-of-birth-hint">
      For example, 15 3 1984
    </div>
    <div class="nhsuk-date-input" id="date-of-birth">
      <div class="nhsuk-date-input__item">
        <div class="nhsuk-form-group">
          <label class="nhsuk-label nhsuk-date-input__label" for="date-of-birth-day">
            Day
          </label>
          <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2" id="date-of-birth-day" name="dateOfBirth[day]" type="text" autocomplete="bday-day" inputmode="numeric">
        </div>
      </div>
      <div class="nhsuk-date-input__item">
        <div class="nhsuk-form-group">
          <label class="nhsuk-label nhsuk-date-input__label" for="date-of-birth-month">
            Month
          </label>
          <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2" id="date-of-birth-month" name="dateOfBirth[month]" type="text" autocomplete="bday-month" inputmode="numeric">
        </div>
      </div>
      <div class="nhsuk-date-input__item">
        <div class="nhsuk-form-group">
          <label class="nhsuk-label nhsuk-date-input__label" for="date-of-birth-year">
            Year
          </label>
          <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-4" id="date-of-birth-year" name="dateOfBirth[year]" type="text" autocomplete="bday-year" inputmode="numeric">
        </div>
      </div>
    </div>
  </fieldset>
</div>

<div class="nhsuk-form-group">
  <label class="nhsuk-label" for="input-width-20">
    National Insurance number
  </label>
  <div class="nhsuk-hint" id="national-insurance-hint">
      For example, ‘QQ 12 34 56 C’
    </div>
  <input class="nhsuk-input nhsuk-input--width-20" id="input-width-20" name="inputWidth20" type="text">
</div>

<button class="nhsuk-button" data-module="nhsuk-button" type="submit">
            Continue
          </button>
</form>

{% endblock %}
